# .github/workflows/security.yml
# Installed by lockdown-security. Runs npm audit on every PR + push to main,
# typecheck + build to catch type regressions, and a daily run on main to
# pick up advisories that drop overnight.
name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily at 03:00 UTC — catches new advisories dropped overnight.
    - cron: "0 3 * * *"

# This workflow only consumes well-formed inputs (no PR titles or
# user-supplied strings flow into `run:` blocks), so contents:read is enough.
permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: npm audit (production only, high+)
        run: npm audit --omit=dev --audit-level=high

  typecheck-and-build:
    name: typecheck + build
    runs-on: ubuntu-latest
    # next build prerenders pages that query Postgres (e.g. /about), so give it an empty database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Build-time placeholders only — nothing here is used at runtime. Real values live in the
      # server's .env (see deploy/README.md). Prisma does not open a connection until a query runs.
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: build-placeholder-build-placeholder-build-pl=
      GOOGLE_CLIENT_ID: build-placeholder
      GOOGLE_CLIENT_SECRET: build-placeholder
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: build-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client (skipped if no Prisma)
        run: '[ -f prisma/schema.prisma ] && npx prisma generate || echo "no prisma, skipping"'
      - run: npx tsc --noEmit
      - name: Apply migrations to the throwaway database
        run: npx prisma migrate deploy
      - run: npm run build
