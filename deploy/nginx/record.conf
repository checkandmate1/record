# /etc/nginx/sites-available/record  — production (record.mtrokel.org → :3001)
# Origin sits behind Cloudflare; TLS at the origin is from certbot (Let's Encrypt).
# Cloudflare real-IP mapping lives in /etc/nginx/conf.d/cloudflare-realip.conf (written by provision.sh).

server {
    listen 80;
    listen [::]:80;
    server_name record.mtrokel.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name record.mtrokel.org;

    ssl_certificate     /etc/letsencrypt/live/record.mtrokel.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/record.mtrokel.org/privkey.pem;
    include /etc/nginx/snippets/record-ssl.conf;   # written by deploy/provision.sh

    client_max_body_size 50m;      # matches next.config.ts serverActions.bodySizeLimit
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js static assets: long cache, served straight from the app.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
